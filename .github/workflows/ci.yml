name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
      - run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "run: make fmt" >&2
            exit 1
          fi
        shell: bash
      - run: go test ./...
      - run: go test -race ./...
      - if: runner.os == 'Linux'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run
      - if: runner.os == 'Linux'
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go build -ldflags "-s -w -X main.version=ci" -o bin/omi ./cmd/omi
        if: runner.os != 'Windows'
        shell: bash
      - run: go build -ldflags "-s -w -X main.version=ci" -o bin/omi.exe ./cmd/omi
        if: runner.os == 'Windows'
        shell: bash
      - run: ./bin/omi --version
        if: runner.os != 'Windows'
        shell: bash
      - run: ./bin/omi.exe --version
        if: runner.os == 'Windows'
        shell: bash
